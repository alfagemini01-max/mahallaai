{% extends "base.html" %}
{% block title %}Kirish{% endblock %}
{% block auth %}
<div class="login-wrap">
  <div class="login-card">
    <div class="login-head">
      <div class="brand-mark big">🏘</div>
      <h1>Mahalla AI</h1>
      <p>Boshqaruv paneliga kirish</p>
    </div>
    {% if error %}<div class="alert">{{ error }}</div>{% endif %}
    <form method="post" action="/login">
      <label>Login
        <input type="text" name="username" required autofocus autocomplete="username">
      </label>
      <label>Parol
        <input type="password" name="password" required autocomplete="current-password">
      </label>
      <button type="submit" class="btn primary wide">Kirish</button>
    </form>
    <p class="login-note">Hisobingiz yo'qmi? Mahalla raisi yoki tizim administratoriga murojaat qiling.</p>
  </div>
</div>
{% endblock %}
