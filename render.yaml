# Render.com — avtomatik deploy konfiguratsiyasi
# GitHub repozitoriyni Render'ga ulaganingizda ushbu fayl avtomatik o'qiladi
# (New -> Blueprint) yoki oddiy Web Service sifatida qo'lda ham sozlash mumkin.

services:
  - type: web
    name: mahalla-ai-bot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: BOT_TOKEN
        sync: false          # Render dashboardda qo'lda kiritiladi
      - key: GEMINI_API_KEY
        sync: false
      - key: SECRET_KEY
        generateValue: true  # Render o'zi tasodifiy yaratadi
      - key: WEBHOOK_SECRET
        generateValue: true
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        sync: false          # O'zingiz kuchli parol kiriting!
      - key: PYTHON_VERSION
        value: 3.12.0
      # PostgreSQL ishlatilsa (tavsiya etiladi):
      # - key: DATABASE_URL
      #   fromDatabase:
      #     name: mahalla-db
      #     property: connectionString

